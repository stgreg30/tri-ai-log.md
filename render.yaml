services:
  - type: web
    name: uai-brain
    env: python
    buildCommand: pip install -r requirements.txt && python init_neurons.py
    startCommand: uvicorn brain:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.0